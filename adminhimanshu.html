<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Upload Memories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .upload-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .preview-image { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg upload-card rounded-2xl p-8 text-white">
        <div class="text-center mb-6">
            <span class="text-5xl">🎂</span>
            <h1 class="text-3xl font-bold mt-4">Memory Uploader</h1>
            <p class="text-gray-300 text-sm">Add photos for Himanshu Bhai</p>
        </div>
        
        <img id="imagePreview" class="preview-image mb-4" alt="Preview">
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm mb-2">Select Image</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full px-3 py-2 bg-white/10 rounded-lg border border-white/20 text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-yellow-500 file:text-black">
            </div>
            <div>
                <label class="block text-sm mb-2">Caption</label>
                <input type="text" id="captionInput" placeholder="e.g., Best memory!" class="w-full px-3 py-2 bg-white/10 rounded-lg border border-white/20 text-white placeholder-gray-400">
            </div>
            <button id="uploadBtn" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-red-500 rounded-xl font-bold hover:opacity-90 transition">
                <i class="fas fa-upload"></i> UPLOAD PHOTO
            </button>
        </div>
        
        <div id="status" class="mt-4 text-center text-sm"></div>
        
        <div class="mt-6 border-t border-white/20 pt-4">
            <p class="text-xs text-gray-400 text-center">Images stored via Firebase Storage</p>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDS0rzCKglHblF2dlFEKE-ouV0yOu0z5UM",
            authDomain: "mine-a1e68.firebaseapp.com",
            projectId: "mine-a1e68",
            storageBucket: "mine-a1e68.appspot.com",
            messagingSenderId: "48499757892",
            appId: "1:48499757892:web:d0fd281ab0df945e893d11"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        
        // Image preview
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
        
        // Upload to Firebase Storage (simpler and more reliable)
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('imageInput');
            const caption = document.getElementById('captionInput').value.trim() || 'Himanshu Bhai';
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');
            
            if (!fileInput.files || !fileInput.files[0]) {
                statusDiv.innerHTML = '<p class="text-red-400">❌ Please select an image</p>';
                return;
            }
            
            const file = fileInput.files[0];
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> UPLOADING...';
            statusDiv.innerHTML = '<p class="text-yellow-400">Uploading image...</p>';
            
            try {
                // Generate unique filename
                const timestamp = Date.now();
                const filename = `birthday_${timestamp}_${file.name}`;
                const storageRef = storage.ref(`birthday_images/${filename}`);
                
                // Upload file
                await storageRef.put(file);
                
                // Get download URL
                const downloadURL = await storageRef.getDownloadURL();
                
                statusDiv.innerHTML = '<p class="text-blue-400">Saving to database...</p>';
                
                // Save to Firestore
                await db.collection('birthday_images').add({
                    url: downloadURL,
                    caption: caption,
                    uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    active: true,
                    filename: filename
                });
                
                statusDiv.innerHTML = '<p class="text-green-400">✅ Photo uploaded successfully!</p>';
                
                // Reset
                fileInput.value = '';
                document.getElementById('captionInput').value = '';
                document.getElementById('imagePreview').style.display = 'none';
                
            } catch (error) {
                console.error("Upload error:", error);
                statusDiv.innerHTML = `<p class="text-red-400">❌ Error: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-upload"></i> UPLOAD PHOTO';
            }
        });
    </script>
</body>
</html>
