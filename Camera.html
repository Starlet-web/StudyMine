<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: Arial; }
        video { width: 100%; height: 100%; position: fixed; object-fit: cover; opacity: 0.8; }
        
        .screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; background: rgba(0,0,0,0.95);
        }
        .box {
            background: #111; border: 2px solid #333;
            border-radius: 20px; padding: 30px; text-align: center;
            color: white; width: 90%; max-width: 350px;
        }
        input {
            width: 100%; padding: 15px; font-size: 20px;
            text-align: center; border: 2px solid #4CAF50;
            background: #000; color: #4CAF50;
            border-radius: 10px; margin: 15px 0;
            letter-spacing: 3px; outline: none;
        }
        button {
            width: 100%; padding: 15px;
            background: #4CAF50; color: black;
            border: none; border-radius: 10px;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .hidden { display: none !important; }
        #status {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); color: #0f0;
            background: rgba(0,0,0,0.8); padding: 8px 15px;
            border-radius: 20px; font-size: 11px; z-index: 5;
        }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline muted></video>
    
    <!-- Setup Screen -->
    <div class="screen" id="setup">
        <div class="box">
            <h2>📷 Create Room</h2>
            <p style="font-size:12px;color:#888;">Enter secret room code</p>
            <input type="text" id="roomInput" placeholder="e.g., baby123" maxlength="20" autocomplete="off">
            <button onclick="initCamera()">START CAMERA</button>
            <p style="font-size:10px;color:#555;margin-top:15px;">
                ✅ Screen off hone ke baad bhi chalega
            </p>
        </div>
    </div>
    
    <!-- Permission Screen -->
    <div class="screen hidden" id="permScreen">
        <div class="box">
            <h2>🔐 Allow Camera</h2>
            <p style="font-size:12px;color:#888;">Tap button to grant permission</p>
            <button onclick="startCamera()">📷 ALLOW CAMERA ACCESS</button>
        </div>
    </div>
    
    <div id="status" class="hidden">🟢 Ready</div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Tumhara Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDFQQ1cHavVG3X0yLm7qGpTOWCQziFLUeQ",
            authDomain: "studymine-fa92d.firebaseapp.com",
            projectId: "studymine-fa92d",
            storageBucket: "studymine-fa92d.firebasestorage.app",
            messagingSenderId: "460797718327",
            appId: "1:460797718327:web:66316f16930b304b2e34b2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let roomCode, stream, isStreaming = false;

        // Step 1: Room code enter
        window.initCamera = function() {
            roomCode = document.getElementById('roomInput').value.trim().toLowerCase();
            if (!roomCode || roomCode.length < 3) {
                alert('Room code minimum 3 characters!');
                return;
            }
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('permScreen').classList.remove('hidden');
        };

        // Step 2: Get camera permission (MUST be from button click)
        window.startCamera = async function() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 320 },
                        height: { ideal: 240 }
                    },
                    audio: false
                });
                
                document.getElementById('v').srcObject = stream;
                document.getElementById('permScreen').classList.add('hidden');
                
                showStatus('🟢 Connected');
                startStreaming();
                
                // Keep screen awake
                if (navigator.wakeLock) {
                    setInterval(() => {
                        navigator.wakeLock.request('screen').catch(() => {});
                    }, 15000);
                }
                
                // Clean up when leaving
                window.addEventListener('beforeunload', () => {
                    stopStreaming();
                });
                
            } catch(e) {
                alert('❌ Camera permission denied!\n\nSettings mein jaake camera allow karo.');
                document.getElementById('permScreen').classList.remove('hidden');
            }
        };

        function showStatus(msg) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.classList.remove('hidden');
        }

        // Step 3: Stream to Firebase
        function startStreaming() {
            isStreaming = true;
            const video = document.getElementById('v');
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            
            // Remove old data, start fresh
            const roomRef = ref(db, 'streams/' + roomCode);
            set(roomRef, { active: true, startedAt: Date.now() });
            
            // Clean up when disconnected
            onDisconnect(roomRef).remove();
            
            async function captureAndSend() {
                if (!isStreaming) return;
                
                try {
                    // Draw frame
                    ctx.drawImage(video, 0, 0, 320, 240);
                    const imageData = canvas.toDataURL('image/jpeg', 0.35);
                    
                    // Send to Firebase
                    await set(roomRef, {
                        image: imageData,
                        timestamp: Date.now()
                    });
                    
                    showStatus('🟢 Live | Room: ' + roomCode);
                    
                } catch(e) {
                    showStatus('🔴 Error, retrying...');
                }
                
                // Next frame after delay
                if (isStreaming) {
                    setTimeout(captureAndSend, 1500);
                }
            }
            
            captureAndSend();
        }

        function stopStreaming() {
            isStreaming = false;
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            const roomRef = ref(db, 'streams/' + roomCode);
            remove(roomRef);
        }

        // Restart if page becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !isStreaming && stream) {
                startStreaming();
            }
        });

        window.stopStreaming = stopStreaming;
    </script>
</body>
</html>
