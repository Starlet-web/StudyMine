<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Secret Cam - Guaranteed Working</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        #videoContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .camera-mode video {
            object-fit: cover;
            opacity: 0.4;
        }

        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 24px;
            padding: 40px 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }

        .role-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .role-btn {
            padding: 20px;
            border: 2px solid #333;
            border-radius: 16px;
            background: #222;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }
        .role-btn .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }
        .role-btn.active {
            border-color: #00e676;
            background: rgba(0,230,118,0.1);
            transform: scale(1.02);
        }
        .role-btn.viewer-active {
            border-color: #00b0ff;
            background: rgba(0,176,255,0.1);
        }

        input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            text-align: center;
            border: 2px solid #333;
            border-radius: 12px;
            background: #0a0a0a;
            color: #fff;
            letter-spacing: 1px;
            outline: none;
            margin-bottom: 16px;
        }
        input:focus {
            border-color: #00e676;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-green {
            background: #00e676;
            color: #000;
        }
        .btn-blue {
            background: #00b0ff;
            color: #fff;
        }
        .btn-red {
            background: #ff1744;
            color: #fff;
            margin-top: 12px;
        }

        #statusBar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff1744;
        }
        .status-dot.live {
            background: #00e676;
            animation: pulse 2s infinite;
        }
        .status-dot.waiting {
            background: #ffa502;
            animation: blink 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px #00e676; }
            50% { box-shadow: 0 0 20px #00e676; }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,230,118,0.9);
            color: #000;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            pointer-events: none;
            animation: slideDown 2s ease;
        }
        @keyframes slideDown {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .connection-info {
            background: #111;
            padding: 12px;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 12px;
            color: #aaa;
            display: none;
        }
        .connection-info.show {
            display: block;
        }
        .highlight {
            color: #00e676;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="statusBar" class="hidden">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Ready</span>
    </div>

    <!-- Main Screen -->
    <div class="screen" id="mainScreen">
        <div class="card">
            <div style="font-size: 48px; margin-bottom: 12px;">🔐</div>
            <div class="title">Secret Cam</div>
            <div class="subtitle">Peer-to-Peer Secure Video</div>

            <div class="role-btns">
                <div class="role-btn active" id="camBtn" onclick="selectRole('camera')">
                    <span class="emoji">📷</span> Camera
                </div>
                <div class="role-btn" id="viewBtn" onclick="selectRole('viewer')">
                    <span class="emoji">👁️</span> Viewer
                </div>
            </div>

            <input type="text" id="roomInput" placeholder="Enter Room Code" maxlength="20" autocomplete="off">
            <button class="btn btn-green" id="startBtn" onclick="startConnection()">▶ START CAMERA</button>
            <button class="btn btn-red hidden" id="stopBtn" onclick="stopAll()">⏹️ STOP</button>
            
            <div class="connection-info" id="connInfo">
                <p>🔗 Share this code: <span class="highlight" id="shareCode" onclick="copyCode()"></span></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, onValue, remove, onDisconnect, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

       // Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDFQQ1cHavVG3X0yLm7qGpTOWCQziFLUeQ",
  authDomain: "studymine-fa92d.firebaseapp.com",
  projectId: "studymine-fa92d",
  storageBucket: "studymine-fa92d.firebasestorage.app",
  messagingSenderId: "460797718327",
  appId: "1:460797718327:web:66316f16930b304b2e34b2",
  measurementId: "G-ZBJ6GLM3L8"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

        // Global variables
        let role = 'camera';
        let roomCode = '';
        let localStream = null;
        let peerConnection = null;
        let isConnected = false;

        // Make functions global
        window.selectRole = function(r) {
            role = r;
            const camBtn = document.getElementById('camBtn');
            const viewBtn = document.getElementById('viewBtn');
            const startBtn = document.getElementById('startBtn');
            const input = document.getElementById('roomInput');

            camBtn.className = 'role-btn' + (r === 'camera' ? ' active' : '');
            viewBtn.className = 'role-btn' + (r === 'viewer' ? ' viewer-active' : '');

            if (r === 'camera') {
                startBtn.textContent = '▶ START CAMERA';
                startBtn.className = 'btn btn-green';
                input.placeholder = 'Create a room code';
            } else {
                startBtn.textContent = '🔗 JOIN ROOM';
                startBtn.className = 'btn btn-blue';
                input.placeholder = 'Enter camera room code';
            }
        };

        window.startConnection = async function() {
            roomCode = document.getElementById('roomInput').value.trim();
            if (!roomCode || roomCode.length < 3) {
                showToast('⚠️ Enter at least 3 characters');
                return;
            }

            if (role === 'camera') {
                await startCamera();
            } else {
                await joinRoom();
            }
        };

        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                }).catch(async () => {
                    return await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    });
                });

                document.getElementById('video').srcObject = localStream;
                document.body.classList.add('camera-mode');
                
                // Show UI updates
                document.getElementById('startBtn').classList.add('hidden');
                document.getElementById('stopBtn').classList.remove('hidden');
                document.getElementById('connInfo').classList.add('show');
                document.getElementById('shareCode').textContent = roomCode;
                
                showStatus('waiting', 'Waiting for viewer...');
                showToast('📱 Share code: ' + roomCode);

                // Create offer
                await createPeerConnection();
                
                // Listen for answers
                listenForAnswers();

            } catch (error) {
                console.error('Camera error:', error);
                showToast('❌ Camera access denied!');
            }
        }

        async function joinRoom() {
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('stopBtn').classList.remove('hidden');
            showStatus('waiting', 'Connecting to camera...');

            await createPeerConnection();
            
            // Listen for offers
            listenForOffers();
        }

        async function createPeerConnection() {
            const configuration = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    {
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            };

            peerConnection = new RTCPeerConnection(configuration);

            if (role === 'camera' && localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendICECandidate(event.candidate);
                }
            };

            peerConnection.ontrack = (event) => {
                console.log('Got remote track!');
                document.getElementById('video').srcObject = event.streams[0];
                document.body.classList.remove('camera-mode');
                showStatus('live', '🔴 LIVE Connected!');
                isConnected = true;
            };

            peerConnection.onconnectionstatechange = () => {
                console.log('Connection state:', peerConnection.connectionState);
                if (peerConnection.connectionState === 'connected') {
                    showStatus('live', '🔴 LIVE');
                } else if (peerConnection.connectionState === 'disconnected' || 
                          peerConnection.connectionState === 'failed') {
                    showStatus('waiting', 'Connection lost. Retrying...');
                    isConnected = false;
                }
            };
        }

        async function createOffer() {
            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                // Store offer in Firebase
                const offerRef = ref(database, `rooms/${roomCode}/offer`);
                await set(offerRef, {
                    sdp: offer.sdp,
                    type: offer.type
                });
                
                // Clean up on disconnect
                onDisconnect(ref(database, `rooms/${roomCode}`)).remove();
                
                console.log('Offer created and stored');
            } catch (error) {
                console.error('Error creating offer:', error);
            }
        }

        function listenForAnswers() {
            const answerRef = ref(database, `rooms/${roomCode}/answer`);
            onValue(answerRef, async (snapshot) => {
                const data = snapshot.val();
                if (data && peerConnection && !isConnected) {
                    console.log('Got answer from viewer');
                    try {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    } catch (error) {
                        console.error('Error setting remote description:', error);
                    }
                }
            });

            // Also listen for ICE candidates
            const iceRef = ref(database, `rooms/${roomCode}/viewerIce`);
            onValue(iceRef, (snapshot) => {
                const data = snapshot.val();
                if (data && peerConnection) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(data))
                        .catch(e => console.error('Error adding ICE:', e));
                }
            });
        }

        function listenForOffers() {
            const offerRef = ref(database, `rooms/${roomCode}/offer`);
            onValue(offerRef, async (snapshot) => {
                const data = snapshot.val();
                if (data && peerConnection && !isConnected) {
                    console.log('Got offer from camera');
                    try {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                        
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        
                        // Store answer
                        const answerRef = ref(database, `rooms/${roomCode}/answer`);
                        await set(answerRef, {
                            sdp: answer.sdp,
                            type: answer.type
                        });
                        
                        console.log('Answer sent');
                    } catch (error) {
                        console.error('Error handling offer:', error);
                    }
                }
            });

            // Listen for ICE candidates
            const iceRef = ref(database, `rooms/${roomCode}/cameraIce`);
            onValue(iceRef, (snapshot) => {
                const data = snapshot.val();
                if (data && peerConnection) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(data))
                        .catch(e => console.error('Error adding ICE:', e));
                }
            });
        }

        function sendICECandidate(candidate) {
            if (!candidate) return;
            
            const iceKey = role === 'camera' ? 'cameraIce' : 'viewerIce';
            const iceRef = ref(database, `rooms/${roomCode}/${iceKey}`);
            set(iceRef, {
                candidate: candidate.candidate,
                sdpMid: candidate.sdpMid,
                sdpMLineIndex: candidate.sdpMLineIndex
            });
        }

        window.stopAll = function() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            // Clean Firebase
            if (roomCode) {
                remove(ref(database, `rooms/${roomCode}`));
            }
            
            document.getElementById('video').srcObject = null;
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('connInfo').classList.remove('show');
            document.getElementById('statusBar').classList.add('hidden');
            document.body.classList.remove('camera-mode');
            isConnected = false;
            
            showToast('📴 Disconnected');
        };

        window.copyCode = function() {
            const code = document.getElementById('shareCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                showToast('📋 Code copied! Share with friend');
            });
        };

        function showStatus(state, message) {
            const bar = document.getElementById('statusBar');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            bar.classList.remove('hidden');
            dot.className = 'status-dot ' + state;
            text.textContent = message;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Keyboard support
        document.getElementById('roomInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.startConnection();
        });

        // Auto-generate room code
        const randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        document.getElementById('roomInput').value = randomCode;

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (peerConnection) peerConnection.close();
            if (roomCode) remove(ref(database, `rooms/${roomCode}`));
        });

        console.log('✅ Secret Cam Ready');
        console.log('📷 Camera: Create code → Start → Share');
        console.log('👁️ Viewer: Enter code → Join');
    </script>
</body>
</html>
