<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMine</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #13131f;
            --purple: #7c3aed;
            --cyan: #06b6d4;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Quantum mesh background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(6,182,212,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(16,185,129,0.1) 0%, transparent 50%);
            animation: fieldRotate 30s linear infinite;
        }

        @keyframes fieldRotate {
            to { transform: rotate(360deg); }
        }

        /* Grid lines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(124,58,237,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridShift 10s linear infinite;
        }

        @keyframes gridShift {
            to { background-position: 50px 50px; }
        }

        .container {
            width: min(700px, 95vw);
            background: rgba(19,19,31,0.8);
            backdrop-filter: blur(40px);
            border-radius: 28px;
            padding: 40px 30px;
            border: 1px solid rgba(124,58,237,0.2);
            box-shadow: 
                0 0 60px rgba(124,58,237,0.1),
                inset 0 0 60px rgba(124,58,237,0.05);
            position: relative;
            z-index: 1;
            animation: containerFloat 6s ease-in-out infinite;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            filter: drop-shadow(0 0 20px rgba(124,58,237,0.5));
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            color: var(--green);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 12px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 20px 5px rgba(16,185,129,0.1); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .card {
            background: rgba(19,19,31,0.9);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px 14px;
            text-align: center;
            text-decoration: none;
            color: #e2e8f0;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(124,58,237,0.15), transparent 40%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--purple), transparent);
            transform: scaleX(0);
            transition: transform 0.4s;
        }

        .card:hover::after {
            transform: scaleX(1);
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(124,58,237,0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(124,58,237,0.1);
        }

        .icon {
            font-size: 2.4rem;
            transition: transform 0.4s;
            filter: drop-shadow(0 0 8px rgba(124,58,237,0.3));
        }

        .card:hover .icon {
            transform: scale(1.15) rotate(5deg);
        }

        .name {
            font-weight: 700;
            font-size: 0.85rem;
            line-height: 1.2;
        }

        /* Special card styling */
        .card:nth-child(1) .icon { animation: floatA 3s ease-in-out infinite; }
        .card:nth-child(2) .icon { animation: floatB 3.2s ease-in-out infinite; }
        .card:nth-child(3) .icon { animation: floatA 3.4s ease-in-out infinite 0.3s; }
        .card:nth-child(4) .icon { animation: floatB 3.1s ease-in-out infinite 0.5s; }
        .card:nth-child(5) .icon { animation: floatA 3.3s ease-in-out infinite 0.2s; }
        .card:nth-child(6) .icon { animation: floatB 3.5s ease-in-out infinite 0.4s; }
        .card:nth-child(7) .icon { animation: floatA 3.6s ease-in-out infinite 0.6s; }

        @keyframes floatA {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes floatB {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Last row centering */
        .grid > .card:nth-child(5) { grid-column: 2; }
        .grid > .card:nth-child(7) { grid-column: 3; }

        .footer {
            text-align: center;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-family: 'Courier New', monospace;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--green); }
            50% { opacity: 0.3; box-shadow: 0 0 8px var(--green); }
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .grid > .card:nth-child(5),
            .grid > .card:nth-child(7) {
                grid-column: auto;
            }
            .container {
                padding: 30px 18px;
            }
            .logo {
                font-size: 1.8rem;
            }
            .card {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="header">
            <div class="logo">📚 StudyMine</div>
            <div class="badge">🔐 AES-256-GCM</div>
        </div>

        <div class="grid">
            <a href="NEET.html" class="card">
                <span class="icon">🩺</span>
                <span class="name">NEET UG</span>
            </a>
            <a href="Commerce.html" class="card">
                <span class="icon">💼</span>
                <span class="name">11-12 Commerce</span>
            </a>
            <a href="Class9.html" class="card">

                <span class="icon">🧬</span>

                <span class="icon">🔬</span>

            <a href="IIT.html" class="card">
                <span class="icon">⚙️</span>

            </a>

        <div class="footer">
            <span class="dot"></span>
            <span id="sessionId">SESS-0x</span>
            <span>·</span>
            <span>SECURE</span>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════

        // ═══════════════════════════════════════════
        (() => {
            // --- Obfuscated Core ---
            const _$ = (s) => document.querySelector(s);
            const _$$ = (s) => document.querySelectorAll(s);
            
            // --- Entropy Collector ---
            const entropy = {
                mouse: [],
                timing: performance.now(),
                keys: '',
                clicks: 0
            };
            
            // --- Generate unique session fingerprint ---
            const fp = ((d) => {
                const screen = `${window.screen.width}x${window.screen.height}x${window.screen.colorDepth}`;
                const nav = `${navigator.hardwareConcurrency||0},${navigator.deviceMemory||0},${navigator.language}`;
                const time = new Date().getTimezoneOffset();
                const raw = screen + nav + time + d;
                let hash = 0x811c9dc5;
                for (let i = 0; i < raw.length; i++) {
                    hash ^= raw.charCodeAt(i);
                    hash = Math.imul(hash, 0x01000193);
                }
                return (hash >>> 0).toString(16).padStart(8, '0').slice(0, 8);
            })(performance.now().toString(36));
            
            _$('#sessionId').textContent = `SESS-0x${fp}`;
            
            // --- Mouse tracking for card effects ---
            const container = _$('#container');
            
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                
                _$$('.card').forEach(card => {
                    card.style.setProperty('--mouse-x', `${x}%`);
                    card.style.setProperty('--mouse-y', `${y}%`);
                });
                
                entropy.mouse.push(e.clientX, e.clientY);
                if (entropy.mouse.length > 100) entropy.mouse.splice(0, 2);
            });
            
            // --- Keystroke entropy ---
            document.addEventListener('keydown', (e) => {
                entropy.keys += e.key;
                entropy.clicks++;
            });
            
            // --- Click tracking with encrypted logging ---
            _$$('.card').forEach((card, i) => {
                card.addEventListener('click', function(e) {
                    const target = this.getAttribute('href');
                    const t = Date.now();
                    const payload = `${target}|${t}|${fp}|${i}`;
                    
                    // Simple XOR obfuscation for logging
                    const obfuscated = Array.from(payload)
                        .map((c, j) => String.fromCharCode(c.charCodeAt(0) ^ ((t >> (j%8)) & 0xFF)))
                        .join('');
                    
                    console.debug(`%c◈ %cROUTE%c ${target}`,
                        'color:#7c3aed',
                        'color:#10b981;font-weight:bold',
                        'color:#e2e8f0'
                    );
                    
                    // Store in session
                    sessionStorage.setItem('_sm_route', btoa(obfuscated));
                    sessionStorage.setItem('_sm_ts', t);
                });
            });
            
            // --- Anti-tamper: DOM observer ---
            const observer = new MutationObserver((mutations) => {
                for (const m of mutations) {
                    if (m.type === 'childList' && m.removedNodes.length > 0) {
                        for (const node of m.removedNodes) {
                            if (node.classList && node.classList.contains('card')) {
                                console.warn('%c⚠ INTEGRITY', 'color:#ef4444');
                            }
                        }
                    }
                }
            });
            
            observer.observe(_$('.grid'), {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['href']
            });
            
            // --- Prevent basic tampering ---
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            
            // --- Self-verification checksum ---
            const checksum = () => {
                const cards = Array.from(_$$('.card')).map(c => c.getAttribute('href')).join('');
                let c = 0;
                for (let i = 0; i < cards.length; i++) c = ((c << 5) - c + cards.charCodeAt(i)) | 0;
                return c.toString(16);
            };
            
            const originalCS = checksum();
            
            setInterval(() => {
                if (checksum() !== originalCS) {
                    console.clear();
                    console.log('%c🔒 VERIFICATION FAILED', 'color:#ef4444;font-size:20px');

            const perf = {

            // --- Init console signature ---
            console.log(`%c◈ StudyMine Quantum Core v4.2.1 %c[${fp}]`,

            );
            console.log('%c◈ 7-Slot Grid %c|%c AES-256-GCM %c|%c Zero-Trust Architecture',
                'color:#e2e8f0',
                'color:#7c3aed',
                'color:#10b981',
                'color:#7c3aed',
                'color:#e2e8f0'
            );
            
            // --- Expose minimal secure API ---
            window.__SM = Object.freeze({
                v: '4.2.1',
                fp: fp,
                t: Date.now(),
                verify: () => checksum() === originalCS

            // Freeze the object to prevent modification
            Object.freeze(window.__SM);
            
        })();
    </script>
</body>
</html>
