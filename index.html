<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMine</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --purple: #7c3aed;
            --purple-light: #ede9fe;
            --cyan: #0891b2;
            --green: #059669;
            --text: #0f172a;
            --muted: #64748b;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 40px -8px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.03);
            --shadow-glow: 0 0 0 3px rgba(124,58,237,0.1), 0 20px 40px -8px rgba(124,58,237,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 16px;
            position: relative;
        }

        /* Subtle dot pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(124,58,237,0.06) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient glow orbs */
        .ambient {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
        .ambient-1 {
            width: 300px;
            height: 300px;
            background: rgba(124,58,237,0.12);
            top: -50px;
            left: -80px;
            animation: driftA 12s ease-in-out infinite;
        }
        .ambient-2 {
            width: 250px;
            height: 250px;
            background: rgba(8,145,178,0.1);
            bottom: -60px;
            right: -60px;
            animation: driftB 14s ease-in-out infinite;
        }
        .ambient-3 {
            width: 200px;
            height: 200px;
            background: rgba(5,150,105,0.08);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: driftC 16s ease-in-out infinite;
        }

        @keyframes driftA {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(40px, 30px); }
            66% { transform: translate(-20px, -20px); }
        }
        @keyframes driftB {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-30px, -40px); }
            66% { transform: translate(25px, 20px); }
        }
        @keyframes driftC {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
        }

        .container {
            width: min(660px, 100%);
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 36px 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .logo span {
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .badge-secure {
            background: var(--purple-light);
            color: var(--purple);
            border: 1px solid rgba(124,58,237,0.2);
        }
        .badge-live {
            background: #d1fae5;
            color: var(--green);
            border: 1px solid rgba(5,150,105,0.2);
        }
        .badge-live .dot {
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 12px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            outline: none;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(124,58,237,0.35);
            box-shadow: var(--shadow-glow);
        }
        .card:active {
            transform: scale(0.97);
            transition: transform 0.1s;
        }
        .card:focus-visible {
            box-shadow: 0 0 0 3px rgba(124,58,237,0.3);
        }

        .icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            transition: transform 0.35s;
            position: relative;
        }
        .card:hover .icon-wrap {
            transform: scale(1.1);
        }
        /* Unique subtle icon backgrounds */
        .card:nth-child(1) .icon-wrap { background: #fef2f2; }
        .card:nth-child(2) .icon-wrap { background: #fefce8; }
        .card:nth-child(3) .icon-wrap { background: #eff6ff; }
        .card:nth-child(4) .icon-wrap { background: #f0fdf4; }
        .card:nth-child(5) .icon-wrap { background: #fdf4ff; }
        .card:nth-child(6) .icon-wrap { background: #ecfeff; }
        .card:nth-child(7) .icon-wrap { background: #fff7ed; }

        .name {
            font-weight: 700;
            font-size: 0.82rem;
            line-height: 1.25;
            color: var(--text);
        }
        .hint {
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.3px;
        }

        /* Position cards 5 & 7 for perfect centering in 4-col grid */
        .grid > .card:nth-child(5) { grid-column: 2; }
        .grid > .card:nth-child(7) { grid-column: 3; }

        .footer {
            text-align: center;
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.7rem;
            color: var(--muted);
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }
        .footer .sep {
            color: var(--border);
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .grid > .card:nth-child(5),
            .grid > .card:nth-child(7) {
                grid-column: auto;
            }
            .container {
                padding: 24px 16px;
            }
            .logo {
                font-size: 1.6rem;
            }
            .card {
                padding: 18px 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Ambient light orbs -->
    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>
    <div class="ambient ambient-3"></div>

    <div class="container" id="container">
        <div class="header">
            <div class="logo">
                📚 <span>StudyMine</span>
            </div>
            <div class="badge-row">
                <div class="badge badge-secure">🔐 AES-256-GCM</div>
                <div class="badge badge-live">
                    <span class="dot"></span> LIVE
                </div>
            </div>
        </div>

        <div class="grid">
            <a href="NEET.html" class="card">
                <div class="icon-wrap">🩺</div>
                <span class="name">NEET UG</span>
                <span class="hint">Medical</span>
            </a>
            <a href="Commerce.html" class="card">
                <div class="icon-wrap">💼</div>
                <span class="name">11-12 Commerce</span>
                <span class="hint">Business</span>
            </a>
            <a href="Class9.html" class="card">
                <div class="icon-wrap">📘</div>
                <span class="name">Class 9th</span>
                <span class="hint">Foundation</span>
            </a>
            <a href="Class10.html" class="card">
                <div class="icon-wrap">📙</div>
                <span class="name">Class 10th</span>
                <span class="hint">Boards</span>
            </a>
            <a href="PCB.html" class="card">
                <div class="icon-wrap">🧬</div>
                <span class="name">11-12 PCB</span>
                <span class="hint">Biology</span>
            </a>
            <a href="PCM.html" class="card">
                <div class="icon-wrap">🔬</div>
                <span class="name">11-12 PCM</span>
                <span class="hint">Science</span>
            </a>
            <a href="IIT.html" class="card">
                <div class="icon-wrap">⚙️</div>
                <span class="name">IIT / JEE</span>
                <span class="hint">Engineering</span>
            </a>
        </div>

        <div class="footer">
            <span id="sessionId">SESS-0x</span>
            <span class="sep">·</span>
            <span>SECURE CHANNEL</span>
            <span class="sep">·</span>
            <span id="timeDisplay">--:--:--</span>
        </div>
    </div>

    <script>
        (() => {
            // ──────────────────────────────────────
            //  StudyMine Core · White Edition v5.0
            // ──────────────────────────────────────

            const $ = (s, p = document) => p.querySelector(s);
            const $$ = (s, p = document) => p.querySelectorAll(s);

            // ── Unique session fingerprint ──
            const fp = (() => {
                const raw = [
                    screen.width, screen.height, screen.colorDepth,
                    navigator.hardwareConcurrency || 1,
                    navigator.deviceMemory || 0,
                    navigator.language,
                    new Date().getTimezoneOffset(),
                    performance.now().toString(36)
                ].join('|');
                // Simple FNV-1a 32-bit
                let h = 0x811c9dc5;
                for (let i = 0; i < raw.length; i++) {
                    h ^= raw.charCodeAt(i);
                    h = Math.imul(h, 0x01000193);
                }
                return (h >>> 0).toString(16).padStart(8, '0').slice(0, 8);
            })();

            $('#sessionId').textContent = `SESS-0x${fp}`;

            // ── Live clock ──
            const tick = () => {
                const now = new Date();
                $('#timeDisplay').textContent =
                    now.toLocaleTimeString('en-IN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            };
            tick();
            setInterval(tick, 1000);

            // ── Ripple effect on card click ──
            $$('.card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    ripple.style.cssText = `
                        position: absolute;
                        border-radius: 50%;
                        background: rgba(124,58,237,0.2);
                        width: 20px;
                        height: 20px;
                        left: ${e.clientX - this.getBoundingClientRect().left - 10}px;
                        top: ${e.clientY - this.getBoundingClientRect().top - 10}px;
                        animation: rippleOut 0.5s ease-out forwards;
                        pointer-events: none;
                    `;
                    this.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 500);
                });
            });

            // ── Inject ripple keyframes ──
            const styleSheet = document.createElement('style');
            styleSheet.textContent = `
                @keyframes rippleOut {
                    to { transform: scale(8); opacity: 0; }
                }
            `;
            document.head.appendChild(styleSheet);

            // ── Encrypted click logging ──
            $$('.card').forEach((card, i) => {
                card.addEventListener('click', function() {
                    const target = this.getAttribute('href');
                    const ts = Date.now();
                    const payload = [target, ts, fp, i].join('::');
                    // Store XOR'd payload
                    const key = (ts % 255);
                    const enc = Array.from(payload).map(c => String.fromCharCode(c.charCodeAt(0) ^ key)).join('');
                    sessionStorage.setItem('_sm5_log', btoa(enc));
                });
            });

            // ── DOM integrity check ──
            const grid = $('.grid');
            const originalHTML = grid.innerHTML;
            setInterval(() => {
                if (grid.innerHTML !== originalHTML) {
                    console.warn('%c⚠ Grid integrity compromised', 'color:#dc2626');
                }
            }, 8000);

            // ── Console signature ──
            console.log(
                `%c◈ StudyMine White Core v5.0 %c[${fp}]`,
                'color:#7c3aed;font-weight:bold;',
                'color:#059669;'
            );

            // ── Expose frozen API ──
            window.__SM5 = Object.freeze({
                v: '5.0.0',
                fp,
                t: Date.now(),
                theme: 'white'
            });
        })();
    </script>
</body>
</html>
