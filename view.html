<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer Phone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; font-family: Arial; color: white; }
        video { width: 100vw; height: 100vh; object-fit: contain; background: #111; }
        .box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 30px; border-radius: 20px;
            text-align: center; z-index: 10; border: 2px solid #2196F3;
        }
        input { padding: 12px; font-size: 18px; text-align: center; border-radius: 10px; border: 2px solid #2196F3; background: #111; color: #2196F3; width: 200px; margin: 10px 0; }
        button { padding: 12px 30px; background: #2196F3; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 5px; }
        .hidden { display: none !important; }
        #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; z-index: 5; }
        .loader { width: 40px; height: 40px; border: 3px solid #333; border-top: 3px solid #2196F3; border-radius: 50%; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
        #controls button { width: 45px; height: 45px; border-radius: 50%; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); font-size: 18px; }
        .rec { border-color: red !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 red; } 50% { box-shadow: 0 0 0 12px transparent; } }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    
    <div id="login" class="box">
        <h2>👁️ Connect to Camera</h2>
        <p style="font-size:12px;color:#aaa;">Same room name as Camera phone</p>
        <input type="text" id="room" placeholder="Room Name" maxlength="15">
        <br>
        <button onclick="connect()">🔗 CONNECT</button>
    </div>
    
    <div id="status" class="hidden">
        <div class="loader"></div>
        <p>Connecting to camera...</p>
        <button onclick="location.reload()" style="background:#2196F3;color:white;border:none;padding:10px 20px;border-radius:10px;margin-top:10px;">RETRY</button>
    </div>
    
    <div id="controls" class="hidden">
        <button onclick="snap()">📸</button>
        <button id="recBtn" onclick="toggleRec()">⏺️</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@aspnet/signalr@1.0.0/dist/browser/signalr.min.js"></script>
    <script>
        let connection, pc, roomName, mediaRecorder, chunks = [];

        const SIGNALR_URL = "https://webrtc-signalr.azurewebsites.net/chat";

        async function connect() {
            roomName = document.getElementById('room').value.trim();
            if (!roomName) return alert('Room name dalo!');

            document.getElementById('login').classList.add('hidden');
            document.getElementById('status').classList.remove('hidden');

            connection = new signalR.HubConnectionBuilder()
                .withUrl(SIGNALR_URL)
                .build();

            connection.on('Signal', async (from, data) => {
                if (!pc) await createPC();
                
                if (data.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    connection.invoke('Signal', from, answer);
                } else if (data.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(data));
                }
            });

            connection.on('SenderLeft', () => {
                document.getElementById('v').srcObject = null;
                document.getElementById('controls').classList.add('hidden');
                document.getElementById('status').classList.remove('hidden');
                document.getElementById('status').innerHTML = '<p>Camera offline</p><button onclick="location.reload()" style="background:#2196F3;color:white;border:none;padding:10px 20px;border-radius:10px;">RECONNECT</button>';
            });

            try {
                await connection.start();
                await connection.invoke('JoinRoom', roomName, 'viewer');
                
                setTimeout(() => {
                    if (!pc || pc.connectionState !== 'connected') {
                        document.getElementById('status').innerHTML = '<p>❌ Camera not found!</p><p style="font-size:12px;color:#aaa;">Check room name or start camera first</p><button onclick="location.reload()" style="background:#2196F3;color:white;border:none;padding:10px 20px;border-radius:10px;">RETRY</button>';
                    }
                }, 15000);
            } catch(e) {
                document.getElementById('status').innerHTML = '<p>Connection error!</p><button onclick="location.reload()" style="background:#2196F3;color:white;border:none;padding:10px 20px;border-radius:10px;">RETRY</button>';
            }
        }

        async function createPC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.ontrack = e => {
                document.getElementById('v').srcObject = e.streams[0];
                document.getElementById('status').classList.add('hidden');
                document.getElementById('controls').classList.remove('hidden');
            };

            pc.onicecandidate = e => {
                if (e.candidate) connection.invoke('Signal', roomName, e.candidate);
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'failed') {
                    document.getElementById('controls').classList.add('hidden');
                    document.getElementById('status').classList.remove('hidden');
                }
            };
        }

        function snap() {
            const v = document.getElementById('v');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const a = document.createElement('a');
            a.download = `snap-${Date.now()}.png`;
            a.href = c.toDataURL();
            a.click();
        }

        function toggleRec() {
            const btn = document.getElementById('recBtn');
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btn.classList.remove('rec');
                btn.textContent = '⏺️';
                return;
            }
            const stream = document.getElementById('v').srcObject;
            if (!stream) return;
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.download = `rec-${Date.now()}.webm`;
                a.href = URL.createObjectURL(blob);
                a.click();
                chunks = [];
            };
            mediaRecorder.start();
            btn.classList.add('rec');
            btn.textContent = '⏹️';
        }

        document.getElementById('room').addEventListener('keypress', e => {
            if (e.key === 'Enter') connect();
        });
    </script>
</body>
</html>
