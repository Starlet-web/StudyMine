<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Phone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; font-family: Arial; color: white; }
        video { width: 100%; height: 100%; position: fixed; object-fit: cover; }
        .box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 30px; border-radius: 20px;
            text-align: center; z-index: 10; border: 2px solid #4CAF50;
        }
        input { padding: 12px; font-size: 18px; text-align: center; border-radius: 10px; border: 2px solid #4CAF50; background: #111; color: #4CAF50; width: 200px; margin: 10px 0; }
        button { padding: 12px 30px; background: #4CAF50; color: black; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 5px; }
        .hidden { display: none !important; }
        #status { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px; font-size: 12px; z-index: 5; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .green { background: #4CAF50; animation: blink 1.5s infinite; }
        .blue { background: #2196F3; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline muted></video>
    
    <div id="setup" class="box">
        <h2>📷 Camera Setup</h2>
        <p style="font-size:12px;color:#aaa;">Enter any room name</p>
        <input type="text" id="room" placeholder="Room Name" maxlength="15">
        <br>
        <button onclick="initCamera()">▶ START</button>
        <br><small style="color:#666;">Same name use karna Viewer mein</small>
    </div>
    
    <div id="permBox" class="box hidden">
        <h2>🔐 Allow Camera</h2>
        <button onclick="getCamera()">📷 ALLOW CAMERA</button>
    </div>
    
    <div id="status" class="hidden">
        <span class="dot green" id="dot"></span>
        <span id="txt">Ready</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@aspnet/signalr@1.0.0/dist/browser/signalr.min.js"></script>
    <script>
        let connection, pc, stream, roomName, viewerId;

        // FREE Signaling Server (already hosted)
        const SIGNALR_URL = "https://webrtc-signalr.azurewebsites.net/chat";

        async function initCamera() {
            roomName = document.getElementById('room').value.trim();
            if (!roomName) return alert('Room name dalo!');
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('permBox').classList.remove('hidden');
        }

        async function getCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                document.getElementById('v').srcObject = stream;
                document.getElementById('permBox').classList.add('hidden');
                showStatus('green', 'Connecting...');
                await connectSignalR(true);
            } catch(e) {
                alert('Camera access denied! Settings mein jaake allow karo.');
            }
        }

        function showStatus(color, msg) {
            document.getElementById('status').classList.remove('hidden');
            document.getElementById('dot').className = 'dot ' + color;
            document.getElementById('txt').textContent = msg;
        }

        async function connectSignalR(isSender) {
            connection = new signalR.HubConnectionBuilder()
                .withUrl(SIGNALR_URL)
                .build();

            connection.on('Signal', async (from, data) => {
                if (!pc) await createPeerConnection(isSender);
                
                if (data.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    connection.invoke('Signal', from, answer);
                } else if (data.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                } else if (data.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(data));
                }
            });

            connection.on('ViewerJoined', async (viewer) => {
                viewerId = viewer;
                showStatus('blue', 'Viewer connected!');
                await createPeerConnection(true);
            });

            connection.on('ViewerLeft', () => {
                showStatus('green', 'Viewer left. Waiting...');
                if (pc) { pc.close(); pc = null; }
            });

            await connection.start();
            await connection.invoke('JoinRoom', roomName, isSender ? 'sender' : 'viewer');
            
            if (isSender) {
                showStatus('green', `Room: ${roomName} | Waiting for viewer...`);
            }
        }

        async function createPeerConnection(isSender) {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.onicecandidate = e => {
                if (e.candidate) connection.invoke('Signal', viewerId, e.candidate);
            };

            if (isSender && stream) {
                stream.getTracks().forEach(t => pc.addTrack(t, stream));
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                connection.invoke('Signal', viewerId, offer);
            }

            if (!isSender) {
                pc.ontrack = e => {
                    document.getElementById('v').srcObject = e.streams[0];
                    showStatus('blue', '📡 LIVE');
                };
            }
        }

        // Wake lock
        if (navigator.wakeLock) setInterval(() => navigator.wakeLock.request('screen').catch(()=>{}), 15000);
    </script>
</body>
</html>
