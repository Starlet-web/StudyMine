<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photos | Himanshu Bhai Birthday</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs (Same as working CSIR portal) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .upload-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .preview-image { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            border-radius: 12px; 
            display: none; 
            margin-bottom: 15px;
        }
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10B981;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg upload-card p-8 text-white">
        <div class="text-center mb-6">
            <span class="text-5xl">🎂</span>
            <h1 class="text-3xl font-bold mt-4">Photo Uploader</h1>
            <p class="text-gray-300 text-sm mt-2">Add birthday photos for Himanshu Bhai</p>
        </div>
        
        <img id="imagePreview" class="preview-image" alt="Preview">
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2">Select Photo</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full px-3 py-2 bg-white/10 rounded-lg border border-white/20 text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-yellow-500 file:text-black hover:file:bg-yellow-400 cursor-pointer">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Caption (optional)</label>
                <input type="text" id="captionInput" placeholder="e.g., Best moment!" class="w-full px-3 py-2 bg-white/10 rounded-lg border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-yellow-500 placeholder-gray-400">
            </div>
            <button id="uploadBtn" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-red-500 rounded-xl font-bold hover:opacity-90 transition flex items-center justify-center gap-2">
                <span class="loading-spinner" id="loadingSpinner"></span>
                <i class="fas fa-upload" id="uploadIcon"></i>
                <span id="uploadText">UPLOAD PHOTO</span>
            </button>
        </div>
        
        <div id="status" class="mt-4 text-center text-sm"></div>
        
        <!-- Recent Uploads -->
        <div class="mt-6">
            <h3 class="text-lg font-semibold mb-3">Recent Uploads</h3>
            <div id="recentUploads" class="space-y-2 max-h-48 overflow-y-auto">
                <!-- Recent uploads appear here -->
            </div>
        </div>
        
        <div class="mt-6 border-t border-white/20 pt-4">
            <p class="text-xs text-gray-400 text-center">Photos stored as Base64 in Firestore</p>
        </div>
    </div>

    <script>
        // Firebase Config (Same as working CSIR portal)
        const firebaseConfig = {
            apiKey: "AIzaSyDS0rzCKglHblF2dlFEKE-ouV0yOu0z5UM",
            authDomain: "mine-a1e68.firebaseapp.com",
            projectId: "mine-a1e68",
            storageBucket: "mine-a1e68.appspot.com",
            messagingSenderId: "48499757892",
            appId: "1:48499757892:web:d0fd281ab0df945e893d11"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Image preview
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
        
        // Load recent uploads
        async function loadRecentUploads() {
            const recentContainer = document.getElementById('recentUploads');
            try {
                const snapshot = await db.collection('birthday_images')
                    .where('active', '==', true)
                    .orderBy('uploadedAt', 'desc')
                    .limit(5)
                    .get();
                
                if (!snapshot.empty) {
                    recentContainer.innerHTML = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const imageUrl = data.imageUrl || data.url;
                        const div = document.createElement('div');
                        div.className = 'flex items-center gap-3 bg-white/5 rounded-lg p-2';
                        div.innerHTML = `
                            <img src="${imageUrl}" alt="${data.caption}" class="w-12 h-12 object-cover rounded-lg">
                            <div class="flex-1">
                                <p class="text-sm font-medium">${data.caption || 'Himanshu Bhai'}</p>
                                <p class="text-xs text-gray-400">✓ Uploaded successfully</p>
                            </div>
                            <i class="fas fa-check-circle text-green-400"></i>
                        `;
                        recentContainer.appendChild(div);
                    });
                } else {
                    recentContainer.innerHTML = '<p class="text-gray-400 text-sm text-center">No uploads yet</p>';
                }
            } catch (error) {
                console.error("Error loading recent uploads:", error);
                recentContainer.innerHTML = '<p class="text-red-400 text-sm text-center">Error loading uploads</p>';
            }
        }
        
        // Upload using Base64 (Same method as CSIR portal)
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('imageInput');
            const caption = document.getElementById('captionInput').value.trim() || 'Himanshu Bhai';
            const statusDiv = document.getElementById('status');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const uploadIcon = document.getElementById('uploadIcon');
            const uploadText = document.getElementById('uploadText');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (!fileInput.files || !fileInput.files[0]) {
                statusDiv.innerHTML = '<p class="text-red-400">❌ Please select a photo first</p>';
                return;
            }
            
            const file = fileInput.files[0];
            
            // Show loading state
            uploadBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';
            uploadIcon.style.display = 'none';
            uploadText.textContent = 'UPLOADING...';
            statusDiv.innerHTML = '<p class="text-yellow-400">Reading file...</p>';
            
            try {
                // Read file as Base64 (Same as CSIR portal)
                const reader = new FileReader();
                
                reader.onload = async function(event) {
                    const base64Data = event.target.result;
                    
                    statusDiv.innerHTML = '<p class="text-yellow-400">Saving to database...</p>';
                    
                    try {
                        // Save Base64 directly to Firestore (Same as CSIR portal)
                        await db.collection('birthday_images').add({
                            imageUrl: base64Data,
                            caption: caption,
                            uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            active: true
                        });
                        
                        statusDiv.innerHTML = '<p class="text-green-400">🎉 Photo uploaded successfully!</p>';
                        
                        // Reset form
                        fileInput.value = '';
                        document.getElementById('captionInput').value = '';
                        document.getElementById('imagePreview').style.display = 'none';
                        
                        // Reload recent uploads
                        loadRecentUploads();
                        
                        // Show success toast
                        const toast = document.createElement('div');
                        toast.className = 'success-toast';
                        toast.innerHTML = '✅ Photo added to birthday gallery!';
                        document.body.appendChild(toast);
                        setTimeout(() => toast.remove(), 2500);
                        
                        setTimeout(() => {
                            statusDiv.innerHTML = '';
                        }, 3000);
                        
                    } catch (error) {
                        console.error("Firestore save error:", error);
                        statusDiv.innerHTML = `<p class="text-red-400">❌ Database error: ${error.message}</p>`;
                    }
                };
                
                reader.onerror = function() {
                    statusDiv.innerHTML = '<p class="text-red-400">❌ Error reading file</p>';
                };
                
                reader.readAsDataURL(file);
                
            } catch (error) {
                console.error("Upload error:", error);
                statusDiv.innerHTML = `<p class="text-red-400">❌ Error: ${error.message}</p>`;
            } finally {
                // Reset button state after delay
                setTimeout(() => {
                    uploadBtn.disabled = false;
                    loadingSpinner.style.display = 'none';
                    uploadIcon.style.display = 'inline';
                    uploadText.textContent = 'UPLOAD PHOTO';
                }, 1000);
            }
        });
        
        // Load recent uploads on page load
        loadRecentUploads();
    </script>
</body>
</html>
