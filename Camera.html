<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Secret Cam - Internet Working</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --green: #00e676;
            --blue: #00b0ff;
            --red: #ff1744;
            --text: #ffffff;
            --sub: #888888;
            --border: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        #videoContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #videoContainer video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .camera-mode video {
            object-fit: cover;
            opacity: 0.3;
        }

        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: var(--bg);
            transition: opacity 0.3s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px 20px;
            width: 90%;
            max-width: 370px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 12px;
            color: var(--sub);
            margin-bottom: 22px;
        }

        .role-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .role-btn {
            padding: 16px 10px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }
        .role-btn .emoji {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }
        .role-btn.active-cam {
            border-color: var(--green);
            background: rgba(0,230,118,0.08);
            color: var(--green);
        }
        .role-btn.active-view {
            border-color: var(--blue);
            background: rgba(0,176,255,0.08);
            color: var(--blue);
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: #0d0d0d;
            color: var(--text);
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 14px;
            transition: border 0.3s;
        }
        input:focus {
            border-color: var(--green);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-start {
            background: var(--green);
            color: #000;
        }
        .btn-connect {
            background: var(--blue);
            color: #fff;
        }
        .btn-stop {
            background: var(--red);
            color: #fff;
        }
        .btn-room {
            background: #6c5ce7;
            color: #fff;
            font-size: 14px;
        }

        #statusBar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff1744;
            flex-shrink: 0;
        }
        .status-dot.live {
            background: #00e676;
            box-shadow: 0 0 10px #00e67666;
            animation: pulse 2s infinite;
        }
        .status-dot.waiting {
            background: #ffa502;
            animation: blink 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px #00e67666; }
            50% { box-shadow: 0 0 20px #00e676aa; }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #actionBtns {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            gap: 12px;
        }
        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:active {
            background: rgba(255,255,255,0.2);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; top: 10px; }
            20% { opacity: 1; top: 20px; }
            80% { opacity: 1; top: 20px; }
            100% { opacity: 0; top: 10px; }
        }

        #roomInfo {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 11px;
            color: #aaa;
            display: none;
        }
        #roomInfo.show {
            display: block;
        }
        .copy-text {
            color: var(--green);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="statusBar" class="hidden">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Ready</span>
    </div>

    <div id="actionBtns" class="hidden">
        <button class="action-btn" onclick="takeScreenshot()">📸</button>
        <button class="action-btn" onclick="toggleFullscreen()">⛶</button>
        <button class="action-btn" onclick="stopConnection()">⏹️</button>
    </div>

    <!-- Role Selection Screen -->
    <div class="screen" id="roleScreen">
        <div class="card">
            <div class="icon">🌐</div>
            <div class="title">Secret Cam</div>
            <div class="subtitle">Door se bhi connect karein!</div>

            <div class="role-btns">
                <div class="role-btn active-cam" id="camRole" onclick="selectRole('camera')">
                    <span class="emoji">📷</span> Camera
                </div>
                <div class="role-btn" id="viewRole" onclick="selectRole('viewer')">
                    <span class="emoji">👁️</span> Viewer
                </div>
            </div>

            <input type="text" id="roomInput" placeholder="Secret code daalein" maxlength="30" autocomplete="off">
            <button class="btn btn-start" id="actionBtn" onclick="go()">▶ START CAMERA</button>
            
            <div id="roomInfo">
                <p>🔑 Aapka Room Code: <strong id="displayRoomCode" class="copy-text" onclick="copyRoomCode()"></strong></p>
                <p style="font-size: 10px;">Ye code dost ko bhejein</p>
            </div>
        </div>
    </div>

    <!-- Permission Screen -->
    <div class="screen hidden" id="permScreen">
        <div class="card">
            <div class="icon">🔐</div>
            <div class="title">Allow Camera</div>
            <div class="subtitle">Camera access dena hoga</div>
            <button class="btn btn-start" onclick="requestCamera()">📷 ALLOW CAMERA</button>
            <button class="btn btn-stop" onclick="goBack()">↩️ WAPAS</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        let role = 'camera';
        let roomCode = '';
        let peer = null;
        let localStream = null;
        let currentCall = null;
        let reconnectTimer = null;
        let myPeerId = '';

        // Multiple TURN servers for better connectivity
        const ICE_SERVERS = {
            iceServers: [
                // Google's free STUN servers
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                
                // Twilio's free TURN server
                {
                    urls: 'turn:global.turn.twilio.com:3478?transport=udp',
                    username: 'f4b4035eaa76f4a55de5f4351567653ee4ff6fa97b50b6b334fcc1be9c27212d',
                    credential: 'w1uxM55V9yVoqyVFjt+mxDBV0F87AUCemaYVQGxsPLw='
                },
                {
                    urls: 'turn:global.turn.twilio.com:3478?transport=tcp',
                    username: 'f4b4035eaa76f4a55de5f4351567653ee4ff6fa97b50b6b334fcc1be9c27212d',
                    credential: 'w1uxM55V9yVoqyVFjt+mxDBV0F87AUCemaYVQGxsPLw='
                },
                
                // OpenRelay TURN server
                { urls: 'turn:openrelay.metered.ca:80' },
                { urls: 'turn:openrelay.metered.ca:443' },
                
                // Viagenie TURN
                {
                    urls: 'turn:numb.viagenie.ca',
                    username: 'webrtc@live.com',
                    credential: 'muazkh'
                }
            ],
            iceCandidatePoolSize: 10,
            iceTransportPolicy: 'all'
        };

        // Select Role
        function selectRole(r) {
            role = r;
            const camBtn = document.getElementById('camRole');
            const viewBtn = document.getElementById('viewRole');
            const actionBtn = document.getElementById('actionBtn');
            const input = document.getElementById('roomInput');

            camBtn.className = 'role-btn' + (r === 'camera' ? ' active-cam' : '');
            viewBtn.className = 'role-btn' + (r === 'viewer' ? ' active-view' : '');

            if (r === 'camera') {
                actionBtn.textContent = '▶ START CAMERA';
                actionBtn.className = 'btn btn-start';
                input.placeholder = 'Secret code create karein';
            } else {
                actionBtn.textContent = '🔗 CONNECT TO CAMERA';
                actionBtn.className = 'btn btn-connect';
                input.placeholder = 'Camera wala code daalein';
            }
        }

        // Generate unique room code
        function generateRoomCode() {
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('roomInput').value = random;
            return random;
        }

        // Copy room code
        function copyRoomCode() {
            const code = document.getElementById('displayRoomCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                showToast('📋 Code copy ho gaya! Dost ko bhejein');
            }).catch(() => {
                showToast('Code: ' + code);
            });
        }

        // Go Button
        function go() {
            roomCode = document.getElementById('roomInput').value.trim();
            if (!roomCode || roomCode.length < 3) {
                showToast('⚠️ Kam se kam 3 characters ka code');
                return;
            }

            if (role === 'camera') {
                document.getElementById('roleScreen').classList.add('hidden');
                document.getElementById('permScreen').classList.remove('hidden');
            } else {
                document.getElementById('roleScreen').classList.add('hidden');
                showStatus('waiting', 'Camera se connect ho rahe hain...');
                connectAsViewer();
            }
        }

        // Go Back
        function goBack() {
            document.getElementById('permScreen').classList.add('hidden');
            document.getElementById('roleScreen').classList.remove('hidden');
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
        }

        // Request Camera
        async function requestCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                }).catch(async () => {
                    return await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    });
                });

                document.getElementById('video').srcObject = localStream;
                document.body.classList.add('camera-mode');
                document.getElementById('permScreen').classList.add('hidden');
                showStatus('waiting', 'Camera ready, connecting...');
                connectAsCamera();

            } catch (e) {
                console.error('Camera error:', e);
                showToast('❌ Camera access denied!');
                document.getElementById('permScreen').classList.remove('hidden');
            }
        }

        // Connect as Camera
        function connectAsCamera() {
            if (peer) {
                peer.destroy();
            }

            peer = new Peer({
                config: ICE_SERVERS,
                debug: 2
            });

            peer.on('open', (id) => {
                myPeerId = id;
                console.log('📷 Camera Peer ID:', id);
                
                // Show room info
                const roomInfo = document.getElementById('roomInfo');
                const displayCode = document.getElementById('displayRoomCode');
                roomInfo.classList.add('show');
                displayCode.textContent = roomCode;
                
                showStatus('waiting', 'Room: ' + roomCode + ' | Viewer ka wait...');
                showToast('🔑 Code: ' + roomCode + ' (Dost ko bhejo)');
            });

            peer.on('call', (call) => {
                console.log('📞 Incoming call from viewer');
                call.answer(localStream);
                currentCall = call;
                showStatus('live', '🔴 LIVE | Connected!');
                document.getElementById('actionBtns').classList.remove('hidden');

                call.on('close', () => {
                    console.log('Call ended');
                    showStatus('waiting', 'Viewer disconnected. Waiting...');
                    currentCall = null;
                    document.getElementById('actionBtns').classList.add('hidden');
                });

                call.on('error', (err) => {
                    console.error('Call error:', err);
                    showStatus('waiting', 'Connection error');
                });
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                showStatus('waiting', 'Error. Retrying in 5s...');
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => connectAsCamera(), 5000);
            });

            peer.on('disconnected', () => {
                console.log('Peer disconnected');
                showStatus('waiting', 'Reconnecting...');
                if (peer && !peer.destroyed) {
                    peer.reconnect();
                }
            });
        }

        // Connect as Viewer
        function connectAsViewer() {
            if (peer) {
                peer.destroy();
            }

            peer = new Peer({
                config: ICE_SERVERS,
                debug: 2
            });

            peer.on('open', (id) => {
                myPeerId = id;
                console.log('👁️ Viewer Peer ID:', id);
                showStatus('waiting', 'Camera dhundh rahe hain...');
                
                // Try to connect with retry logic
                attemptConnection(0);
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                showStatus('waiting', 'Retrying...');
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => attemptConnection(0), 5000);
            });

            peer.on('disconnected', () => {
                showStatus('waiting', 'Reconnecting...');
                if (peer && !peer.destroyed) {
                    peer.reconnect();
                }
            });

            function attemptConnection(attempt) {
                if (attempt > 3) {
                    showStatus('waiting', '❌ Camera nahi mila. Code check karein!');
                    return;
                }

                console.log(`Connection attempt ${attempt + 1} for room: ${roomCode}`);
                showStatus('waiting', `Try ${attempt + 1}/4...`);

                // Use room code as the peer ID for camera
                const cameraPeerId = roomCode;
                
                try {
                    const call = peer.call(cameraPeerId, new MediaStream(), {
                        metadata: { roomCode: roomCode }
                    });
                    
                    let connectionTimeout = setTimeout(() => {
                        if (!call.peerConnection || call.peerConnection.iceConnectionState !== 'connected') {
                            console.log('Connection timeout, retrying...');
                            call.close();
                            attemptConnection(attempt + 1);
                        }
                    }, 15000);

                    call.on('stream', (remoteStream) => {
                        clearTimeout(connectionTimeout);
                        console.log('✅ Got remote stream!');
                        document.getElementById('video').srcObject = remoteStream;
                        document.body.classList.remove('camera-mode');
                        showStatus('live', '🔴 LIVE | Connected!');
                        document.getElementById('actionBtns').classList.remove('hidden');
                    });

                    call.on('error', (err) => {
                        clearTimeout(connectionTimeout);
                        console.error('Call error:', err);
                        showStatus('waiting', 'Connect nahi hua. Retry...');
                        setTimeout(() => attemptConnection(attempt + 1), 3000);
                    });

                    call.on('close', () => {
                        clearTimeout(connectionTimeout);
                        showStatus('waiting', 'Camera offline.');
                        document.getElementById('actionBtns').classList.add('hidden');
                    });

                    currentCall = call;
                } catch(e) {
                    console.error('Call setup error:', e);
                    showStatus('waiting', 'Error. Retry...');
                    setTimeout(() => attemptConnection(attempt + 1), 3000);
                }
            }
        }

        // Stop Connection
        function stopConnection() {
            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            document.getElementById('video').srcObject = null;
            document.getElementById('actionBtns').classList.add('hidden');
            document.getElementById('statusBar').classList.add('hidden');
            document.getElementById('roleScreen').classList.remove('hidden');
            document.getElementById('roomInfo').classList.remove('show');
            document.body.classList.remove('camera-mode');
            clearTimeout(reconnectTimer);
        }

        // Status Bar
        function showStatus(state, msg) {
            const bar = document.getElementById('statusBar');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            bar.classList.remove('hidden');
            dot.className = 'status-dot';
            if (state === 'live') dot.classList.add('live');
            if (state === 'waiting') dot.classList.add('waiting');
            text.textContent = msg;
        }

        // Toast
        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // Screenshot
        function takeScreenshot() {
            const video = document.getElementById('video');
            if (!video.srcObject) return;
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const a = document.createElement('a');
            a.download = 'screenshot_' + Date.now() + '.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
            showToast('📸 Screenshot saved!');
        }

        // Fullscreen
        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        // Enter key
        document.getElementById('roomInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') go();
        });

        // Cleanup
        window.addEventListener('beforeunload', () => {
            stopConnection();
        });

        // Reconnect on visibility
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && peer && peer.disconnected && !peer.destroyed) {
                peer.reconnect();
            }
        });

        // Generate random code on load
        window.addEventListener('load', () => {
            generateRoomCode();
        });

        console.log('🌐 Secret Cam Ready - Internet Mode');
        console.log('📷 Camera: Room code share karein');
        console.log('👁️ Viewer: Same code enter karein');
    </script>
</body>
</html>
