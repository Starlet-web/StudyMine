<!DOCTYPE html>
<html>
<head>
    <title>Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: Arial; }
        
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #111;
        }
        
        #login {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ffff;
            text-align: center;
            color: #00ffff;
            z-index: 100;
            width: 90%;
            max-width: 350px;
        }
        
        #login h2 { margin-bottom: 20px; font-size: 18px; }
        
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #00ffff;
            background: #111;
            color: #00ffff;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 5px;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        
        #status {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            z-index: 50;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        
        .loader {
            border: 3px solid #333;
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #controls {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px;
            z-index: 60;
        }
        
        #controls button {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        
        .recording {
            border-color: red !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,0,0,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,0,0,0); }
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    
    <div id="login">
        <h2>🔑 ENTER PASSWORD</h2>
        <input type="password" id="passInput" placeholder="Enter password" maxlength="20" autocomplete="off">
        <button onclick="connect()">📡 CONNECT</button>
        <br><small style="color:#666; font-size:10px;">Same password jo Phone A mein dala tha</small>
    </div>
    
    <div id="status" class="hidden">
        <div class="loader"></div>
        CONNECTING TO CAMERA...
    </div>
    
    <div id="controls" class="hidden">
        <button onclick="snap()" title="Screenshot">📸</button>
        <button id="recBtn" onclick="toggleRec()" title="Record">⏺️</button>
        <button onclick="fullscreen()" title="Fullscreen">⛶</button>
    </div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        let socket, pc, mediaRecorder, chunks = [];

        function connect() {
            const password = document.getElementById('passInput').value.trim();
            if (password.length < 3) {
                alert('Password minimum 3 characters!');
                return;
            }

            const roomName = btoa(password).replace(/=/g, '').substring(0, 20);
            
            document.getElementById('login').classList.add('hidden');
            document.getElementById('status').classList.remove('hidden');

            socket = io('https://webrtc-signaling-3d1b0e8c9a8c.herokuapp.com', {
                transports: ['websocket']
            });

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            });

            // Receive remote stream
            pc.ontrack = event => {
                document.getElementById('v').srcObject = event.streams[0];
                document.getElementById('status').classList.add('hidden');
                document.getElementById('controls').classList.remove('hidden');
            };

            // Connection state monitoring
            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    document.getElementById('controls').classList.add('hidden');
                    document.getElementById('status').classList.remove('hidden');
                    document.getElementById('status').innerHTML = 
                        '<div class="loader"></div> RECONNECTING...';
                    setTimeout(() => {
                        if (pc.connectionState !== 'connected') connect();
                    }, 3000);
                }
            };

            // ICE candidates
            pc.onicecandidate = e => {
                if (e.candidate) {
                    socket.emit('signal', { room: roomName, data: e.candidate });
                }
            };

            // Join room
            socket.emit('join', roomName);

            // Handle signaling
            socket.on('signal', async data => {
                try {
                    if (data.type === 'offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        socket.emit('signal', { room: roomName, data: answer });
                    } else if (data.candidate) {
                        await pc.addIceCandidate(new RTCIceCandidate(data));
                    }
                } catch (e) {
                    console.error('Signal error:', e);
                }
            });

            // Reconnect
            socket.on('disconnect', () => {
                setTimeout(() => {
                    if (socket.disconnected) location.reload();
                }, 3000);
            });

            // Timeout agar 30 sec mein connect nahi hua
            setTimeout(() => {
                if (pc.connectionState !== 'connected' && pc.connectionState !== 'connecting') {
                    document.getElementById('status').innerHTML = 
                        '❌ NO CAMERA FOUND<br><small>Check password or Camera phone</small><br><br>' +
                        '<button onclick="location.reload()" style="padding:10px 20px; background:#00ffff; color:#000; border:none; border-radius:5px;">RETRY</button>';
                }
            }, 30000);
        }

        // Screenshot
        function snap() {
            const video = document.getElementById('v');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const a = document.createElement('a');
            a.download = `Screenshot_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
        }

        // Recording
        function toggleRec() {
            const btn = document.getElementById('recBtn');
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btn.classList.remove('recording');
                btn.innerHTML = '⏺️';
                return;
            }

            const stream = document.getElementById('v').srcObject;
            if (!stream) return;

            const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') 
                ? 'video/webm;codecs=vp9' 
                : 'video/webm';

            mediaRecorder = new MediaRecorder(stream, { mimeType });
            
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) chunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Recording_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.webm`;
                a.click();
                chunks = [];
            };

            mediaRecorder.start(1000); // 1 second chunks
            btn.classList.add('recording');
            btn.innerHTML = '⏹️';
        }

        // Fullscreen
        function fullscreen() {
            const video = document.getElementById('v');
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }
        }

        // Enter key se connect
        document.getElementById('passInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') connect();
        });
    </script>
</body>
</html>
